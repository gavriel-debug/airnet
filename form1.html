    <script>
        lucide.createIcons();

        // === שליפת נתונים ראשונית מהוובהוק ===
        (function sendOpenWebhook() {
            const OPEN_WEBHOOK_URL = 'https://hook.eu1.make.com/urdv6soafdq8im88v5pa87j0jp0gjhvx';
            const params = new URLSearchParams(window.location.search);
            const payload = {
                recordid: params.get('recordid') || '',
                tanantid: params.get('tanantid') || ''
            };

            function setVal(id, value) {
                if (value === undefined || value === null || value === '') return;
                const el = document.getElementById(id);
                if (el) el.value = value;
            }

            fetch(OPEN_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.text())
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    setVal('report_number', data.report_number);
                    setVal('treatment_type', data.treatment_type);
                    setVal('client_name',   data.client_name);
                    setVal('client_id',     data.client_id);
                    setVal('address',       data.address);
                    setVal('phone',         data.phone);
                    setVal('approver',      data.approver);
                    setVal('manufacturer',  data.manufacturer);
                    setVal('model',         data.model);
                    setVal('serial_number', data.serial_number);
                    setVal('call_nature',   data.call_nature);
                } catch (e) {
                    console.warn('התשובה מהוובהוק אינה JSON תקין:', text);
                }
            })
            .catch(err => console.error('שגיאה בשליחת/קבלת הוובהוק:', err));
        })();

        // === לוח חתימה (canvas) ===
        (function setupSignaturePad() {
            const canvas = document.getElementById('signature-pad');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let drawing = false;
            let hasSignature = false;

            function resizeCanvas() {
                const ratio = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                const prev = hasSignature ? canvas.toDataURL() : null;
                canvas.width = rect.width * ratio;
                canvas.height = rect.height * ratio;
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#1e293b';
                if (prev) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
                    img.src = prev;
                }
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            }

            canvas.addEventListener('pointerdown', (e) => {
                drawing = true;
                hasSignature = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                canvas.setPointerCapture(e.pointerId);
            });
            canvas.addEventListener('pointermove', (e) => {
                if (!drawing) return;
                const p = getPos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            });
            canvas.addEventListener('pointerup',   () => { drawing = false; });
            canvas.addEventListener('pointercancel',() => { drawing = false; });

            window.clearSignature = function () {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hasSignature = false;
            };
            window.getSignatureDataUrl = function () {
                return hasSignature ? canvas.toDataURL('image/png') : '';
            };
        })();

        function addDynamicAction() {
            const container = document.getElementById('dynamic-actions');
            const row = document.createElement('div');
            row.className = 'flex flex-col md:flex-row gap-3 items-start md:items-center fade-in-up dynamic-row';
            
            row.innerHTML = `
                <input type="text" placeholder="שם הפעולה" class="action-name w-full md:w-1/3 bg-white border border-slate-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500/40 outline-none transition-all font-medium">
                <input type="text" placeholder="תיאור מורחב" class="action-desc w-full md:flex-1 bg-white border border-slate-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500/40 outline-none transition-all">
                <button type="button" onclick="this.parentElement.remove()" class="delete-action-btn p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors border border-transparent hover:border-red-100" title="מחק שורה">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
            `;
            container.appendChild(row);
            lucide.createIcons();
        }

        // === השליחה המרכזית ויצירת ה-PDF המושלם ללא פשרות ===
        document.getElementById('main-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            const originalText = submitBtn.innerHTML;
            
            submitBtn.innerHTML = '<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> מעבד ומייצר מסמך...';
            submitBtn.disabled = true;
            lucide.createIcons();

            try {
                // 1. בניית ה-JSON המקורי
                const formData = {
                    report_number: document.getElementById('report_number').value,
                    treatment_type: document.getElementById('treatment_type').value,
                    client_name: document.getElementById('client_name').value,
                    client_id: document.getElementById('client_id').value,
                    address: document.getElementById('address').value,
                    phone: document.getElementById('phone').value,
                    approver: document.getElementById('approver').value,
                    manufacturer: document.getElementById('manufacturer').value,
                    model: document.getElementById('model').value,
                    serial_number: document.getElementById('serial_number').value,
                    work_pressure: document.getElementById('work_pressure').value,
                    air_leaks: document.getElementById('air_leaks').value,
                    work_temp: document.getElementById('work_temp').value,
                    room_cleanliness: document.getElementById('room_cleanliness').value,
                    room_temp: document.getElementById('room_temp').value,
                    dryer_check: document.getElementById('dryer_check').value,
                    call_nature: document.getElementById('call_nature').value,
                    notes: document.getElementById('notes').value,
                    technician: document.getElementById('technician').value,
                    form_date: document.getElementById('form_date').value,
                    form_time: document.getElementById('form_time').value,
                    signature_base64: window.getSignatureDataUrl()
                };

                const actions = [];
                document.querySelectorAll('.dynamic-row').forEach(row => {
                    const name = row.querySelector('.action-name').value;
                    const desc = row.querySelector('.action-desc').value;
                    if (name || desc) {
                        actions.push({ name, description: desc });
                    }
                });
                formData.actions = actions;

                // 2. יצירת עותק עצמאי (Clone) של ה-Container לטובת ה-PDF
                const originalContainer = document.getElementById('report-container');
                const clonedContainer = originalContainer.cloneNode(true);

                // אילוץ רוחב נוח (850px) שמאפשר לטקסט לרדת שורה בטבעיות ולא להחתך
                const workerDiv = document.createElement('div');
                workerDiv.style.position = 'absolute';
                workerDiv.style.left = '-9999px';
                workerDiv.style.top = '-9999px';
                workerDiv.style.width = '850px'; 
                workerDiv.setAttribute('dir', 'rtl');
                
                // שינוי הקלאס של ה-Container כך שיתפוס את כל הרוחב המאולץ
                clonedContainer.className = 'w-full';
                workerDiv.appendChild(clonedContainer);
                document.body.appendChild(workerDiv);

                // 3. ניקוי אלמנטים מיותרים מהעותק המשוכפל
                clonedContainer.querySelectorAll('#submit-btn, #add-action-btn, #clear-sig-btn, .delete-action-btn').forEach(el => el.remove());

                // 4. הפיכת שדות קלט לטקסט תוך שמירה על העיצוב המקורי
                clonedContainer.querySelectorAll('input, select, textarea').forEach(input => {
                    let val = input.value;
                    if (input.tagName === 'SELECT') {
                        const selectedOption = input.options[input.selectedIndex];
                        val = selectedOption ? selectedOption.text : input.value;
                    }

                    const div = document.createElement('div');
                    // העתקת העיצוב המקורי, והפיכה לבלוק סטנדרטי (מונע בעיות גלישה)
                    div.className = input.className.replace(/focus:[^\s]+/g, '').replace(/outline-none/g, ''); 
                    div.style.whiteSpace = 'pre-wrap';
                    div.style.wordBreak = 'break-word';
                    div.style.display = 'block'; 
                    div.style.minHeight = '42px';
                    div.style.padding = '0.5rem 0.75rem';
                    
                    if (input.id === 'report_number' || input.id === 'treatment_type') {
                        div.style.backgroundColor = '#1e293b'; 
                        div.style.color = '#ffffff';
                        div.style.borderColor = '#334155';
                        div.style.borderWidth = '1px';
                        div.style.borderStyle = 'solid';
                        div.style.fontWeight = 'bold';
                    } else {
                        div.style.backgroundColor = input.classList.contains('bg-white') ? '#ffffff' : '#f8fafc';
                        div.style.color = '#1e293b';
                    }

                    div.innerText = val || '---';
                    input.parentNode.replaceChild(div, input);
                });

                // 5. טיפול בחתימה בעותק המשוכפל
                const clonedCanvas = clonedContainer.querySelector('#signature-pad');
                if (clonedCanvas && formData.signature_base64) {
                    const img = document.createElement('img');
                    img.src = formData.signature_base64;
                    img.className = 'w-full bg-white border border-slate-200 rounded-lg min-h-[120px] object-contain';
                    clonedCanvas.parentNode.replaceChild(img, clonedCanvas);
                } else if (clonedCanvas) {
                    const noSigSpan = document.createElement('span');
                    noSigSpan.className = 'block w-full bg-white border border-slate-200 rounded-lg min-h-[120px] flex items-center justify-center text-slate-400';
                    noSigSpan.innerText = 'ללא חתימה';
                    clonedCanvas.parentNode.replaceChild(noSigSpan, clonedCanvas);
                }

                // --- הפתרון המנצח: עטיפת כל מילה בודדת בקופסה (Bypassing html2canvas RTL bug) ---
                function wrapWordsInSpans(element) {
                    const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
                    const nodes = [];
                    let node;
                    while ((node = walker.nextNode())) {
                        // אוספים רק טקסט אמיתי, מדלגים על סקריפטים ועיצובים
                        if (node.nodeValue.trim() !== '' && 
                            node.parentNode && 
                            node.parentNode.tagName !== 'SCRIPT' && 
                            node.parentNode.tagName !== 'STYLE') {
                            nodes.push(node);
                        }
                    }
                    
                    nodes.forEach(n => {
                        const words = n.nodeValue.split(/(\s+)/); // שומר על הרווחים במערך
                        const fragment = document.createDocumentFragment();
                        let wrapped = false;
                        
                        words.forEach(word => {
                            if (word.trim() === '') {
                                // זהו רווח - משאירים אותו כטקסט רגיל שהדפדפן יוכל לשבור שורה באמצעותו
                                fragment.appendChild(document.createTextNode(word));
                            } else {
                                // זוהי מילה - עוטפים אותה ב-inline-block כדי ש-html2canvas ימדוד אותה כמקשה אחת
                                const span = document.createElement('span');
                                span.style.display = 'inline-block';
                                span.innerText = word;
                                fragment.appendChild(span);
                                wrapped = true;
                            }
                        });
                        
                        if (wrapped) {
                            n.parentNode.replaceChild(fragment, n);
                        }
                    });
                }
                
                wrapWordsInSpans(clonedContainer);
                // ------------------------------------------------

                // הבטחה שכל הפונטים סיימו להיטען לפני צילום המסמך
                await document.fonts.ready;

                // 6. הגדרות html2pdf
                const opt = {
                    margin:       [10, 10, 10, 10],
                    filename:     `דו_ח_טיפול_${formData.report_number || 'חדש'}.pdf`,
                    image:        { type: 'jpeg', quality: 1 },
                    html2canvas:  { 
                        scale: 2, 
                        useCORS: true,
                        scrollY: 0,
                        scrollX: 0,
                        windowWidth: 850 
                    },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak:    { mode: ['avoid-all', 'css'] }
                };

                // הפקת ה-PDF
                const pdfBase64DataUrl = await html2pdf().set(opt).from(clonedContainer).outputPdf('datauristring');
                
                // הסרת האלמנט הזמני מהדום
                workerDiv.remove();

                // חילוץ ה-Base64
                formData.pdf_base64 = pdfBase64DataUrl.split(',')[1];

                // 7. שליחה לוובהוק
                const TARGET_WEBHOOK = 'https://hook.eu1.make.com/1ukn154fochpe0xprtqj2be2stujtjed';
                const response = await fetch(TARGET_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    alert('הדו"ח והמסמך נשלחו בהצלחה!');
                } else {
                    alert('שגיאה בשליחת הדו"ח. אנא נסה שוב.');
                }

            } catch (error) {
                console.error('Error submitting form:', error);
                alert('אירעה שגיאה בתהליך עיבוד הטופס.');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
