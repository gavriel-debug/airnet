<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טופס דו"ח טיפול - א.א.רם</title>
    
    <!-- פונט עברי מודרני -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- הגדרת פונט מותאם אישית ב-Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- אייקונים -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* עיצוב נוסף עבור אנימציות */
        .fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased py-10 px-4 md:px-0 selection:bg-blue-200">

    <div class="max-w-4xl mx-auto">
        
        <!-- כותרת הטופס (הדר) -->
        <div class="bg-slate-900 text-white rounded-t-2xl p-8 relative overflow-hidden shadow-lg">
            <!-- אלמנט עיצובי ברקע -->
            <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                <div class="absolute -top-20 -left-20 w-80 h-80 bg-blue-500 rounded-full blur-3xl"></div>
            </div>

            <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
                <div>
                    <h1 class="text-3xl font-black mb-1">קבוצת א.א.רם איירנט</h1>
                    <p class="text-slate-400 font-medium">טכנולוגיות אוויר דחוס בע"מ - טופס דיווח מקוון</p>
                </div>
                <div class="flex gap-4 w-full md:w-auto">
                    <div class="flex flex-col flex-1 md:w-32">
                        <label class="text-xs text-slate-400 font-bold mb-1">דו"ח מס'</label>
                        <input type="text" id="report_number" placeholder="לדוג': 29455" class="bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none placeholder:text-slate-500 font-bold">
                    </div>
                    <div class="flex flex-col flex-1 md:w-40">
                        <label class="text-xs text-slate-400 font-bold mb-1">סוג טיפול</label>
                        <input type="text" id="treatment_type" value="טיפול שוטף" class="bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none font-bold">
                    </div>
                </div>
            </div>
        </div>

        <!-- גוף הטופס -->
        <form class="bg-white rounded-b-2xl shadow-xl border border-slate-200 p-8 space-y-10" onsubmit="event.preventDefault(); alert('הטופס נשלח בהצלחה!');">

            <!-- פרטי הלקוח -->
            <section>
                <div class="flex items-center gap-2 mb-4 border-b border-slate-100 pb-2">
                    <i data-lucide="building-2" class="text-blue-600"></i>
                    <h2 class="text-xl font-bold text-slate-800">פרטי הלקוח</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">שם הלקוח <span class="text-red-500">*</span></label>
                        <input type="text" id="client_name" required placeholder="הזן שם לקוח" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">מס' מזהה לקוח</label>
                        <input type="text" id="client_id" placeholder="מספר לקוח" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">כתובת</label>
                        <input type="text" id="address" placeholder="עיר, רחוב..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">טלפון</label>
                        <input type="tel" id="phone" placeholder="מספר טלפון" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">מאשר הדו"ח</label>
                        <input type="text" id="approver" placeholder="שם המאשר" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                    </div>
                </div>
            </section>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <!-- פרטי מסנן קו -->
                <section>
                    <div class="flex items-center gap-2 mb-4 border-b border-slate-100 pb-2">
                        <i data-lucide="settings" class="text-blue-600"></i>
                        <h2 class="text-xl font-bold text-slate-800">פרטי מסנן קו</h2>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">יצרן</label>
                            <input type="text" id="manufacturer" placeholder="לדוג': Ultrafilter" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">דגם</label>
                            <input type="text" id="model" placeholder="לדוג': MF 20/30" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">מספר סידורי</label>
                            <input type="text" id="serial_number" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                        </div>
                    </div>
                </section>

                <!-- נתוני מכונה וחדר -->
                <section>
                    <div class="flex items-center gap-2 mb-4 border-b border-slate-100 pb-2">
                        <i data-lucide="gauge" class="text-blue-600"></i>
                        <h2 class="text-xl font-bold text-slate-800">נתוני מכונה וחדר</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">לחץ עבודה</label>
                            <input type="text" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">דליפות אויר</label>
                            <select class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all appearance-none">
                                <option value="לא">לא</option>
                                <option value="כן">כן</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">טמפ' עבודה</label>
                            <input type="text" placeholder="°C" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">נקיון חדר</label>
                            <select class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all appearance-none">
                                <option value="תקין">תקין</option>
                                <option value="לא תקין">לא תקין</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">טמפ' בחדר</label>
                            <select class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all appearance-none">
                                <option value="תקין">תקין</option>
                                <option value="לא תקין">לא תקין</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">בדיקת מייבש</label>
                            <select class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all appearance-none">
                                <option value="תקין">תקין</option>
                                <option value="לא תקין">לא תקין</option>
                            </select>
                        </div>
                    </div>
                </section>
            </div>

            <!-- מהות הקריאה והטיפול -->
            <section class="bg-blue-50/50 rounded-xl p-6 border border-blue-100">
                <div class="flex items-center gap-2 mb-6">
                    <i data-lucide="wrench" class="text-blue-600"></i>
                    <h2 class="text-xl font-bold text-slate-800">פרטי הקריאה והטיפול</h2>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-bold text-slate-700 mb-2">מהות הקריאה</label>
                    <textarea rows="2" id="call_nature" placeholder="לדוגמה: החלפת אלמנט..." class="w-full bg-white border border-slate-200 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all resize-y"></textarea>
                </div>

                <!-- סקשן פעולות דינאמי -->
                <div class="mb-6">
                    <label class="block text-sm font-bold text-slate-700 mb-2">פעולות שבוצעו</label>
                    
                    <div id="dynamic-actions" class="space-y-3 mb-4">
                        <!-- שורת פעולה ראשונה -->
                        <div class="flex flex-col md:flex-row gap-3 items-start md:items-center">
                            <input type="text" placeholder="שם הפעולה" class="w-full md:w-1/3 bg-white border border-slate-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500/40 outline-none transition-all font-medium">
                            <input type="text" placeholder="תיאור מורחב" class="w-full md:flex-1 bg-white border border-slate-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500/40 outline-none transition-all">
                            <button type="button" onclick="this.parentElement.remove()" class="p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors border border-transparent hover:border-red-100" title="מחק שורה">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <button type="button" onclick="addDynamicAction()" class="flex items-center gap-2 text-sm font-bold text-blue-600 bg-white border-2 border-dashed border-blue-200 hover:border-blue-400 hover:bg-blue-50 px-5 py-2.5 rounded-lg transition-all w-full md:w-auto justify-center">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        הוסף פעולה נוספת
                    </button>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">הערות והמלצות</label>
                    <textarea rows="3" placeholder="הערות להמשך הטיפול, המלצות ללקוח..." class="w-full bg-white border border-slate-200 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all resize-y"></textarea>
                </div>
            </section>

            <!-- סיום ואישורים -->
            <section class="border-t border-slate-200 pt-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- פרטי השירות -->
                    <div class="space-y-5 bg-slate-50 p-6 rounded-xl border border-slate-100">
                        <h3 class="font-bold text-slate-800 border-b border-slate-200 pb-2">פרטי המבצע</h3>
                        
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">השירות ניתן על ידי:</label>
                            <input type="text" placeholder="שם הטכנאי" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">תאריך</label>
                                <input type="date" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1.5">שעה</label>
                                <input type="time" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-2.5 focus:bg-white focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 outline-none transition-all">
                            </div>
                        </div>
                    </div>

                    <!-- חתימה -->
                    <div class="flex flex-col justify-between bg-slate-50 p-6 rounded-xl border border-slate-100">
                        <div class="flex items-center gap-2 mb-4">
                            <i data-lucide="pen-tool" class="text-blue-600"></i>
                            <h3 class="font-bold text-slate-800">חתימת הלקוח</h3>
                        </div>
                        
                        <!-- אזור חתימה (canvas אמיתי - עכבר + מגע) -->
                        <canvas id="signature-pad" class="flex-1 w-full bg-white border-2 border-dashed border-slate-300 rounded-lg cursor-crosshair touch-none min-h-[120px] hover:border-blue-400 transition-colors"></canvas>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-xs text-slate-400 font-medium">חתום באמצעות העכבר או האצבע</span>
                            <button type="button" onclick="clearSignature()" class="flex items-center gap-1 text-xs font-bold text-slate-500 hover:text-red-500 transition-colors">
                                <i data-lucide="eraser" class="w-4 h-4"></i>
                                נקה חתימה
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- כפתור שליחה ענק -->
            <div class="pt-4">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-4 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-5 h-5"></i>
                    שמור ושלח דו"ח
                </button>
            </div>

        </form>
    </div>

    <script>
        // אתחול אייקונים
        lucide.createIcons();

        // === שליחת וובהוק בעת פתיחת הטופס + מילוי אוטומטי מהתשובה ===
        (function sendOpenWebhook() {
            const WEBHOOK_URL = 'https://hook.eu1.make.com/urdv6soafdq8im88v5pa87j0jp0gjhvx';

            // קריאת הפרמטרים מה-URL
            const params = new URLSearchParams(window.location.search);
            const payload = {
                recordid: params.get('recordid') || '',
                tanantid: params.get('tanantid') || ''
            };

            // ממלא שדה רק אם הערך קיים ולא ריק (כדי לא לדרוס ערכי ברירת מחדל)
            function setVal(id, value) {
                if (value === undefined || value === null || value === '') return;
                const el = document.getElementById(id);
                if (el) el.value = value;
            }

            // מיפוי המפתחות מה-JSON אל שדות הטופס
            function fillForm(data) {
                if (!data || typeof data !== 'object') return;
                setVal('report_number', data.report_number);
                setVal('treatment_type', data.treatment_type);
                setVal('client_name',   data.client_name);
                setVal('client_id',     data.client_id);
                setVal('address',       data.address);
                setVal('phone',         data.phone);
                setVal('approver',      data.approver);
                setVal('manufacturer',  data.manufacturer);
                setVal('model',         data.model);
                setVal('serial_number', data.serial_number);
                setVal('call_nature',   data.call_nature);
            }

            // שליחת POST עם JSON ל-Make, וקריאת התשובה
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.text())            // קוראים כטקסט ואז מנסים לפרסר (עמיד יותר)
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    fillForm(data);
                } catch (e) {
                    console.warn('התשובה מהוובהוק אינה JSON תקין:', text);
                }
            })
            .catch(err => console.error('שגיאה בשליחת/קבלת הוובהוק:', err));
        })();

        // === לוח חתימה (canvas) ===
        (function setupSignaturePad() {
            const canvas = document.getElementById('signature-pad');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let drawing = false;
            let hasSignature = false;

            // התאמת רזולוציית ה-canvas לגודל בפועל ולצפיפות הפיקסלים (חתימה חדה)
            function resizeCanvas() {
                const ratio = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                const prev = hasSignature ? canvas.toDataURL() : null;
                canvas.width = rect.width * ratio;
                canvas.height = rect.height * ratio;
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#1e293b';
                if (prev) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
                    img.src = prev;
                }
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            }

            canvas.addEventListener('pointerdown', (e) => {
                drawing = true;
                hasSignature = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                canvas.setPointerCapture(e.pointerId);
            });
            canvas.addEventListener('pointermove', (e) => {
                if (!drawing) return;
                const p = getPos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            });
            canvas.addEventListener('pointerup',   () => { drawing = false; });
            canvas.addEventListener('pointercancel',() => { drawing = false; });

            // זמינות גלובלית: ניקוי + שליפת החתימה כ-base64
            window.clearSignature = function () {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hasSignature = false;
            };
            window.getSignatureDataUrl = function () {
                return hasSignature ? canvas.toDataURL('image/png') : '';
            };
        })();

        // פונקציה להוספת שורות פעולה בצורה דינאמית
        function addDynamicAction() {
            const container = document.getElementById('dynamic-actions');
            
            // יצירת האלמנט החדש
            const row = document.createElement('div');
            row.className = 'flex flex-col md:flex-row gap-3 items-start md:items-center fade-in-up';
            
            row.innerHTML = `
                <input type="text" placeholder="שם הפעולה" class="w-full md:w-1/3 bg-white border border-slate-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500/40 outline-none transition-all font-medium">
                <input type="text" placeholder="תיאור מורחב" class="w-full md:flex-1 bg-white border border-slate-200 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500/40 outline-none transition-all">
                <button type="button" onclick="this.parentElement.remove()" class="p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors border border-transparent hover:border-red-100" title="מחק שורה">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
            `;
            
            container.appendChild(row);
            
            // אתחול מחדש של האייקונים כדי שיופיעו בשורה החדשה
            lucide.createIcons();
        }
    </script>
</body>
</html>
