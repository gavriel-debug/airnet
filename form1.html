    <script>
        lucide.createIcons();

        // === שליפת נתונים ראשונית מהוובהוק בעת פתיחת הטופס ===
        (function sendOpenWebhook() {
            const OPEN_WEBHOOK_URL = 'https://hook.eu1.make.com/urdv6soafdq8im88v5pa87j0jp0gjhvx';

            const params = new URLSearchParams(window.location.search);
            const payload = {
                recordid: params.get('recordid') || '',
                tanantid: params.get('tanantid') || ''
            };

            function setVal(id, value) {
                if (value === undefined || value === null || value === '') return;
                const el = document.getElementById(id);
                if (el) el.value = value;
            }

            fetch(OPEN_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.text())
            .then(text => {
                try {
                    const data = JSON.parse(text);
                    if (!data || typeof data !== 'object') return;
                    setVal('report_number', data.report_number);
                    setVal('treatment_type', data.treatment_type);
                    setVal('client_name',   data.client_name);
                    setVal('client_id',     data.client_id);
                    setVal('address',       data.address);
                    setVal('phone',         data.phone);
                    setVal('approver',      data.approver);
                    setVal('manufacturer',  data.manufacturer);
                    setVal('model',         data.model);
                    setVal('serial_number', data.serial_number);
                    setVal('call_nature',   data.call_nature);
                } catch (e) {
                    console.warn('התשובה אינה JSON תקין:', text);
                }
            })
            .catch(err => console.error('שגיאה:', err));
        })();

        // === לוח חתימה (canvas) ===
        (function setupSignaturePad() {
            const canvas = document.getElementById('signature-pad');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let drawing = false;
            let hasSignature = false;

            function resizeCanvas() {
                const ratio = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                const prev = hasSignature ? canvas.toDataURL() : null;
                canvas.width = rect.width * ratio;
                canvas.height = rect.height * ratio;
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#1e293b';
                if (prev) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
                    img.src = prev;
                }
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            }

            canvas.addEventListener('pointerdown', (e) => {
                drawing = true;
                hasSignature = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                canvas.setPointerCapture(e.pointerId);
            });
            canvas.addEventListener('pointermove', (e) => {
                if (!drawing) return;
                const p = getPos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            });
            canvas.addEventListener('pointerup',   () => { drawing = false; });
            canvas.addEventListener('pointercancel',() => { drawing = false; });

            window.clearSignature = function () {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                hasSignature = false;
            };
            window.getSignatureDataUrl = function () {
                return hasSignature ? canvas.toDataURL('image/png') : '';
            };
        })();

        function addDynamicAction() {

            const row = document.createElement('div');

            row.innerHTML = `

                <button type="button" onclick="this.parentElement.remove()" class="p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors border border-transparent hover:border-red-100" title="מחק שורה">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
            `;
            container.appendChild(row);
            lucide.createIcons();
        }

        // ==========================================
        // מחולל תבנית ה-HTML ל-PDF שיישלח ל-Make

        function generatePDFHtml(data, actions) {
            let actionsRows = '';
            if (actions && actions.length > 0) {
                actions.forEach(act => {
                    actionsRows += `<tr><td style="padding:10px; border:1px solid #cbd5e1; font-weight:bold; background-color:#f8fafc;">${act.name}</td><td style="padding:10px; border:1px solid #cbd5e1;">${act.description}</td></tr>`;
                });
            } else {
                actionsRows = `<tr><td colspan="2" style="padding:10px; border:1px solid #cbd5e1; text-align:center; color:#94a3b8;">לא הוזנו פעולות</td></tr>`;
            }

            const signatureHtml = data.signature_base64 
                ? `<img src="${data.signature_base64}" style="max-height: 80px;" alt="חתימת לקוח">`
                : `<span style="color:#94a3b8;">ללא חתימה</span>`;

            return `
            <!DOCTYPE html>
            <html lang="he" dir="rtl">
            <head>
                <meta charset="UTF-8">
                <style>
                    body { font-family: Arial, sans-serif; direction: rtl; text-align: right; color: #1e293b; line-height: 1.5; font-size: 14px; padding: 20px; margin: 0; }
                    .header { background-color: #0f172a; color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; position: relative; }
                    .header h1 { margin: 0 0 5px 0; font-size: 24px; color: #ffffff; }
                    .header p { margin: 0; color: #94a3b8; font-size: 14px; }
                    .report-meta { position: absolute; left: 25px; top: 25px; text-align: left; }
                    h2 { font-size: 18px; color: #2563eb; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; margin-top: 30px; margin-bottom: 15px; }
                    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
                    th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: right; }
                    th { background-color: #f8fafc; width: 20%; font-weight: bold; color: #475569; }
                    td { width: 30%; }
                    .full-width { width: 100%; }
                    .signature-box { border: 1px dashed #cbd5e1; border-radius: 8px; padding: 15px; width: 250px; text-align: center; margin-top: 10px; min-height: 80px; }
                </style>
            </head>
            <body>
                <div class="header">
                    <h1>קבוצת א.א.רם איירנט</h1>
                    <p>טכנולוגיות אוויר דחוס בע"מ - טופס דיווח מקוון</p>
                    <div class="report-meta">
                        <strong style="color:#cbd5e1;">דו"ח מס':</strong> ${data.report_number || '---'}<br>
                        <strong style="color:#cbd5e1;">סוג טיפול:</strong> ${data.treatment_type || '---'}
                    </div>
                </div>

                <h2>פרטי הלקוח</h2>
                <table>
                    <tr><th>שם הלקוח:</th><td>${data.client_name || ''}</td><th>מס' מזהה:</th><td>${data.client_id || ''}</td></tr>
                    <tr><th>כתובת:</th><td>${data.address || ''}</td><th>טלפון:</th><td>${data.phone || ''}</td></tr>
                    <tr><th>מאשר הדו"ח:</th><td colspan="3">${data.approver || ''}</td></tr>
                </table>

                <h2>פרטי מסנן קו</h2>
                <table>
                    <tr><th>יצרן:</th><td>${data.manufacturer || ''}</td><th>דגם:</th><td>${data.model || ''}</td></tr>
                    <tr><th>מספר סידורי:</th><td colspan="3">${data.serial_number || ''}</td></tr>
                </table>

                <h2>נתוני מכונה וחדר</h2>
                <table>
                    <tr><th>לחץ עבודה:</th><td>${data.work_pressure || ''}</td><th>דליפות אויר:</th><td>${data.air_leaks || ''}</td></tr>
                    <tr><th>טמפ' עבודה:</th><td>${data.work_temp || ''}</td><th>נקיון חדר:</th><td>${data.room_cleanliness || ''}</td></tr>
                    <tr><th>טמפ' בחדר:</th><td>${data.room_temp || ''}</td><th>בדיקת מייבש:</th><td>${data.dryer_check || ''}</td></tr>
                </table>

                <h2>פרטי הקריאה והטיפול</h2>
                <table class="full-width">
                    <tr><th style="width:20%;">מהות הקריאה:</th><td style="width:80%;">${data.call_nature || ''}</td></tr>
                </table>
                
                <table class="full-width">
                    ${actionsRows}
                </table>

                <table class="full-width">
                    <tr><th style="width:20%;">הערות והמלצות:</th><td style="width:80%;">${data.notes || ''}</td></tr>
                </table>

                <h2>פרטי המבצע</h2>
                <table>
                    <tr><th>השירות ניתן ע"י:</th><td>${data.technician || ''}</td><th>תאריך ושעה:</th><td style="direction:ltr; text-align:right;">${data.form_date || ''} | ${data.form_time || ''}</td></tr>
                </table>

                <h2>חתימת הלקוח</h2>
                <div class="signature-box">
                    ${signatureHtml}
                </div>
            </body>
            </html>
            `;
        }

        // === שליחת הטופס לוובהוק ===
        document.getElementById('main-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            const originalText = submitBtn.innerHTML;
            
            submitBtn.innerHTML = '<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> מכין מסמך ושולח...';
            submitBtn.disabled = true;
            lucide.createIcons();

            try {
                // איסוף הנתונים
                const dataObj = {
                    report_number: document.getElementById('report_number').value,
                    treatment_type: document.getElementById('treatment_type').value,
                    client_name: document.getElementById('client_name').value,
                    client_id: document.getElementById('client_id').value,
                    address: document.getElementById('address').value,
                    phone: document.getElementById('phone').value,
                    approver: document.getElementById('approver').value,
                    manufacturer: document.getElementById('manufacturer').value,
                    model: document.getElementById('model').value,
                    serial_number: document.getElementById('serial_number').value,
                    work_pressure: document.getElementById('work_pressure').value,
                    air_leaks: document.getElementById('air_leaks').value,
                    work_temp: document.getElementById('work_temp').value,
                    room_cleanliness: document.getElementById('room_cleanliness').value,
                    room_temp: document.getElementById('room_temp').value,
                    dryer_check: document.getElementById('dryer_check').value,
                    call_nature: document.getElementById('call_nature').value,
                    notes: document.getElementById('notes').value,
                    technician: document.getElementById('technician').value,
                    form_date: document.getElementById('form_date').value,
                    form_time: document.getElementById('form_time').value,
                    signature_base64: window.getSignatureDataUrl()
                };

                const actionsObj = [];
                document.querySelectorAll('.dynamic-row').forEach(row => {
                    const name = row.querySelector('.action-name').value;
                    const desc = row.querySelector('.action-desc').value;
                    if (name || desc) {
                        actionsObj.push({ name, description: desc });
                    }
                });

                // יצירת קוד ה-HTML המלא עבור ה-PDF
                const finalHtmlForPdf = generatePDFHtml(dataObj, actionsObj);

                // המבנה שיישלח ל-Make
                const payload = {
                    ...dataObj,
                    actions: actionsObj,
                    html_for_pdf: finalHtmlForPdf // זה השדה שצריך לחבר למודול המרת ה-PDF
                };

                const TARGET_WEBHOOK = 'https://hook.eu1.make.com/1ukn154fochpe0xprtqj2be2stujtjed';
                const response = await fetch(TARGET_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('הדו"ח והמסמך נשלחו בהצלחה!');
                } else {
                    alert('שגיאה בשליחת הדו"ח. אנא נסה שוב.');
                }

            } catch (error) {
                console.error('Error submitting form:', error);
                alert('אירעה שגיאה בתהליך השליחה.');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
